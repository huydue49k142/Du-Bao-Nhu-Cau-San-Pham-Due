<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự báo nhu cầu</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form { display: flex; flex-direction: column; max-width: 400px; }
        div { margin-bottom: 1em; }
        label { margin-bottom: 0.5em; display: block; }
        input { padding: 0.5em; }
        button { padding: 0.7em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Tải lên tệp dữ liệu để dự báo</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
            <label for="data_file">Chọn tệp dữ liệu (CSV, Excel):</label>
            <input type="file" id="data_file" name="data_file" required>
        </div>
        <div>
            <label for="forecast_days">Số ngày cần dự báo:</label>
            <input type="number" id="forecast_days" name="forecast_days" required min="1">
        </div>
        <button type="submit">Bắt đầu dự báo</button>
    </form>
</body>
</html>
